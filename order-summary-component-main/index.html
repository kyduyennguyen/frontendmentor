<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- displays site properly based on user's device -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- metadata links -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | Order summary card</title>
  </head>
  <body>
    <main id="order-summary-component">
      <img
        id="order-summary-img"
        src="./assets/images/illustration-hero.svg"
        alt="Order Summary banner"
      />
      <section id="order-summary-text">
        <h1 id="title-order-summary">Order Summary</h1>
        <p id="description-order-summary">
          You can now listen to millions of songs, audiobooks, and podcasts on
          any device anywhere you like!
        </p>
      </section>
      <section id="order-summary-plan">
        <img
          id="icon-music"
          src="./assets/images/icon-music.svg"
          alt="Icon Music for Annual Plan"
        />
        <div id="plan-text">
          <h4 id="plan-title">Annual Plan</h4>
          <p>$59.99/year</p>
        </div>
        <a href="#">Change</a>
      </section>
      <section id="order-summary-buttons">
        <button class="summary-btn" id="proceed-btn">Proceed to Payment</button>
        <button class="summary-btn" id="cancel-btn">Cancel Order</button>
      </section>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://github.com/kyduyennguyen">Angelly Nguyen</a>.
    </footer>
  </body>
</html>
