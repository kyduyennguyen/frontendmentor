<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <!-- Links for style -->
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Profile card component</title>
  </head>
  <body>
    <main>
      <header>
        <img
          class="bg-card"
          src="./images/bg-pattern-card.svg"
          alt="Background pattern of Card"
        />
        <div class="bg-avatar">
          <img
            class="avatar-img"
            src="./images/image-angelly.jpeg"
            alt="Avatar of Angelly"
          />
        </div>
        <article class="name-title">
          <h1>Angelly Nguyen <span>30</span></h1>
          <p>Ho Chi Minh</p>
        </article>
      </header>
      <hr />
      <article class="main-content">
        <section class="contents" id="follower">
          <h2>83</h2>
          <p>Followers</p>
        </section>
        <section class="contents" id="like">
          <h2>2.5k</h2>
          <p>Likes</p>
        </section>
        <section class="contents" id="photo">
          <h2>5.4k</h2>
          <p>Photos</p>
        </section>
      </article>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://github.com/kyduyennguyen">Angelly Nguyen</a>.
    </footer>
  </body>
</html>
